name: Collect Hub Items

on:
  schedule:
    - cron: "0 18 * * *"  # 매일 UTC 18:00 = KST 03:00
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backend collection
        run: |
          curl -f -sS -X POST "${{ secrets.NEXT_PUBLIC_API_URL }}/hub/collect" \
            -H "X-Hub-Collector-Key: ${{ secrets.HUB_COLLECTOR_KEY }}"
